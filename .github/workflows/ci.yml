# The release path for eleven repositories, so it is tested before any of them
# pins a new tag. The suite is offline by construction: it puts a directory of
# fake `npm`, `npx` and `gh` executables first on $PATH and lets `git` be real
# against a throwaway repository with a bare remote. Nothing is published, and
# nothing reaches the network.
name: CI

on:
  push:
    branches: ["**"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - run: npm run build
      # `git commit` needs an author, and the fixtures set one per repository —
      # but `git tag -a` in the self-release does not.
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: npm test
